spring.application.name=school-erp-inventory
server.port=8080
# Local secrets (git-ignored), KEY=value lines, e.g. MAIL_PASSWORD=... See backend/.env.example.
# Two paths so it works whether the app is started from backend/ or from the repo root.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
# Frontend origin allowed for CORS
app.cors.allowed-origins=http://localhost:3000
# Jackson 3 fails on missing primitives by default; treat them as false/0 instead.
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Database: Supabase Postgres. Leave SUPABASE_DB_URL blank to run on in-memory mock data.
app.db.url=${SUPABASE_DB_URL:}
app.db.username=${SUPABASE_DB_USER:}
app.db.password=${SUPABASE_DB_PASSWORD:}
app.db.pool-size=${SUPABASE_DB_POOL_SIZE:5}

# RFQ / approval policy
app.approval.official-threshold=10000
app.rfq.min-quotes=3
app.rfq.max-reminders=3
app.rfq.reminder-interval-hours=24

# ---------------------------------------------------------------- messaging channels
# Every value comes from an environment variable. A channel with no credentials runs in "mock" mode
# (logged on the Messages page, not sent). See README > Messaging channels.
app.school-name=Greenfield Public School

# Test safety: live sends only go to these recipients (comma-separated emails / phone numbers).
# Seeded demo vendors have realistic addresses, so keep this until you use real vendor data.
app.messaging.allowed-recipients=${MESSAGING_ALLOWED_RECIPIENTS:}
app.messaging.allow-all-recipients=${MESSAGING_ALLOW_ALL:false}

# Email: SMTP out, IMAP in (Gmail: smtp.gmail.com / imap.gmail.com + a 16-character App Password)
app.mail.smtp.host=${MAIL_SMTP_HOST:}
app.mail.smtp.port=${MAIL_SMTP_PORT:587}
app.mail.smtp.ssl=${MAIL_SMTP_SSL:false}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.imap.host=${MAIL_IMAP_HOST:}
app.mail.imap.port=${MAIL_IMAP_PORT:993}
app.mail.imap.poll-ms=${MAIL_IMAP_POLL_MS:60000}

# WhatsApp: Meta WhatsApp Cloud API. Replies + delivery/read receipts arrive at /api/webhooks/whatsapp
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.rfq-template=${WHATSAPP_RFQ_TEMPLATE:}
app.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}

# SMS: SMSGate Android app (local: http://<phone-ip>:8080/message, cloud: https://api.sms-gate.app/3rdparty/v1/messages)
# Replies + delivery receipts arrive at /api/webhooks/sms
app.sms.send-url=${SMS_GATEWAY_SEND_URL:}
app.sms.username=${SMS_GATEWAY_USERNAME:}
app.sms.password=${SMS_GATEWAY_PASSWORD:}
app.sms.signing-key=${SMS_GATEWAY_SIGNING_KEY:}
